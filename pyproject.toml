[project]
name = "text-sender"
version = "0.1.0"
description = "FastAPI backend for Text Sender"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.44",
  "asyncpg==0.30.0",
  "alembic==1.16.5",
  "pydantic[email]==2.12.3",
  "pydantic-settings==2.13.1",
  "bcrypt==4.0.1",
  "passlib[bcrypt]==1.7.4",
  "python-jose[cryptography]==3.5.0",
  "python-multipart==0.0.20",
  "psycopg[binary]>=3.3,<3.4",
  "python-dotenv>=1.2.2",
  "redis>=7.4.0",
  "celery>=5.6.3",
]

[tool.uv]
package = false
