services:
  db:
    image: postgres:16-alpine
    container_name: text_sender_db
    environment:
      POSTGRES_DB: text_sender
      POSTGRES_USER: text_sender
      POSTGRES_PASSWORD: text_sender
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U text_sender -d text_sender"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: text-sender-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: text_sender_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://text_sender:text_sender@db:5432/text_sender
      SECRET_KEY: super_secret_key_change_me
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    image: text-sender-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: text_sender_frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
