services:
  db:
    image: postgres:16-alpine
    container_name: text_sender_db
    environment:
      POSTGRES_DB: text_sender
      POSTGRES_USER: iv
      POSTGRES_PASSWORD: 12345
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5555:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iv -d text_sender"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: text_sender_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://iv:12345@db:5432/text_sender
      SECRET_KEY: super_secret_key_change_me
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: text_sender_frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge